name: journal-sources-preview

on:
  workflow_dispatch:
    inputs:
      fetch_days:
        description: "回溯抓取天数"
        required: false
        default: "30"
      year_month:
        description: "指定年月，格式 YYYY-MM；填写后优先按整月抓取"
        required: false
        default: ""
      rows_per_journal:
        description: "每本期刊最多抓取条数"
        required: false
        default: "25"
      query:
        description: "关键词；用分号分隔。留空则使用 journal_watchlist.yaml 默认词"
        required: false
        default: "PFAS;perfluoroalkyl;polyfluoroalkyl;PFOA;PFOS"

permissions:
  contents: write

concurrency:
  group: journal-sources-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
      DPR_CONTACT_EMAIL: ${{ secrets.DPR_CONTACT_EMAIL }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install lightweight deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pyyaml

      - name: Fetch journal sources
        run: |
          set -euo pipefail
          FETCH_DAYS="${{ github.event.inputs.fetch_days }}"
          YEAR_MONTH="${{ github.event.inputs.year_month }}"
          ROWS_PER_JOURNAL="${{ github.event.inputs.rows_per_journal }}"
          QUERY="${{ github.event.inputs.query }}"
          if [ -z "$FETCH_DAYS" ]; then
            FETCH_DAYS="30"
          fi
          if [ -z "$ROWS_PER_JOURNAL" ]; then
            ROWS_PER_JOURNAL="25"
          fi
          mkdir -p journal-preview docs/journals
          ARGS=(
            --rows-per-journal "$ROWS_PER_JOURNAL"
            --query "$QUERY"
            --output docs/journals/journal-papers.json
          )
          if [ -n "$YEAR_MONTH" ]; then
            ARGS+=(--month "$YEAR_MONTH")
          else
            ARGS+=(--days "$FETCH_DAYS")
          fi
          python src/maintain/fetchers/fetch_journal_sources.py "${ARGS[@]}"
          export YEAR_MONTH
          python - <<'PY'
          import json
          import os
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          def parse_month(value):
              text = str(value or "").strip()
              if not text:
                  return ""
              try:
                  return datetime.fromisoformat(text.replace("Z", "+00:00")).strftime("%Y-%m")
              except ValueError:
                  return text[:7] if len(text) >= 7 and text[4] == "-" else ""

          data_path = Path("docs/journals/journal-papers.json")
          history_dir = Path("docs/journals/history")
          history_dir.mkdir(parents=True, exist_ok=True)

          rows = json.loads(data_path.read_text(encoding="utf-8")) if data_path.exists() else []
          if not isinstance(rows, list):
              raise SystemExit("docs/journals/journal-papers.json must contain a JSON array")

          fallback_month = os.environ.get("YEAR_MONTH") or datetime.now(timezone.utc).strftime("%Y-%m")
          grouped = defaultdict(list)
          for row in rows:
              month = parse_month(row.get("published") if isinstance(row, dict) else "") or fallback_month
              grouped[month].append(row)
          if not grouped:
              grouped[fallback_month] = []

          for month, month_rows in sorted(grouped.items()):
              (history_dir / f"{month}.json").write_text(
                  json.dumps(month_rows, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )

          months = []
          for path in sorted(history_dir.glob("????-??.json"), reverse=True):
              try:
                  month_rows = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  month_rows = []
              months.append(
                  {
                      "month": path.stem,
                      "path": f"docs/journals/history/{path.name}",
                      "count": len(month_rows) if isinstance(month_rows, list) else 0,
                  }
              )

          index = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "latest": months[0]["month"] if months else "",
              "months": months,
          }
          (history_dir / "index.json").write_text(
              json.dumps(index, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"journal history months={len(months)}")
          PY
          cp docs/journals/journal-papers.json journal-preview/journal_papers.json

      - name: Print preview summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("journal-preview/journal_papers.json")
          rows = json.loads(path.read_text(encoding="utf-8")) if path.exists() else []
          print(f"journal_papers count={len(rows)}")
          for row in rows[:20]:
              print("---")
              print(row.get("journal_label"), row.get("published"), row.get("doi"))
              print(row.get("title"))
              print("open_pdf_status=", row.get("open_pdf_status"), "source=", row.get("open_pdf_source"))
              print("metadata_sources=", ",".join(row.get("metadata_sources") or []))
          PY

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: journal-papers-preview
          path: journal-preview/journal_papers.json

      - name: Commit journal website data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/journals/journal-papers.json docs/journals/history
          if git diff --cached --quiet; then
            echo "No journal data changes to commit."
            exit 0
          fi
          git commit -m "[chore] update journal sources data"
          git push
