name: smart-query-generate

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Unique request id generated by the web UI"
        required: true
      tag:
        description: "Short query tag"
        required: true
      description:
        description: "User query description"
        required: true
      prompt:
        description: "Prompt built by the web UI"
        required: true

permissions:
  contents: write

concurrency:
  group: smart-query-generate-${{ github.event.inputs.request_id }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
      SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
      SUMMARY_BASE_URL: ${{ secrets.SUMMARY_BASE_URL }}
      SUMMARY_MODEL: ${{ secrets.SUMMARY_MODEL }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate smart query candidates
        run: |
          python scripts/smart_query_generate.py \
            --request-id "${{ github.event.inputs.request_id }}" \
            --tag "${{ github.event.inputs.tag }}" \
            --description "${{ github.event.inputs.description }}" \
            --prompt "${{ github.event.inputs.prompt }}"

      - name: Commit generated result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME:-main}"

          git add docs/smart-query-results
          if git diff --cached --quiet; then
            echo "No smart query result to commit."
            exit 0
          fi

          git commit -m "[chore] smart query candidates"
          git fetch origin "$branch"
          git rebase -X theirs "origin/$branch"
          git push origin HEAD:"$branch"
